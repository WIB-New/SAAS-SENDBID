# ──────────────────────────────────────────────────────────────────────────────
#  SAAS SENDBID — Nginx configuration for Storage Service
#  /etc/nginx/sites-available/sendbid-storage.conf
#
#  CRITICAL SECURITY RULES:
#  1. Public path:    /public/avatars/   → served by Nginx with CDN headers
#  2. Private paths:  /uploads/kyc/      → BLOCKED at Nginx level
#                     /uploads/receipts/ → BLOCKED at Nginx level
# ──────────────────────────────────────────────────────────────────────────────

upstream sendbid_storage {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name storage.sendbid.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name storage.sendbid.com;

    # ── TLS
    ssl_certificate     /etc/letsencrypt/live/storage.sendbid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storage.sendbid.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "no-referrer" always;

    # ── Upload size
    client_max_body_size 15M;

    # ── CRITICAL: BLOCK public access to sensitive directories
    # These blocks must come BEFORE any positive location rules.
    location ~* ^/uploads/(kyc|receipts)/ {
        deny all;
        return 403 "Access denied";
    }

    # Also block any attempt to reach sensitive uploads through proxy
    location ~* /(kyc|receipts)/ {
        deny all;
        return 403 "Access denied";
    }

    # ── PUBLIC: Serve avatar files directly from disk (bypasses FastAPI)
    # Nginx serves these with long cache headers for Cloudflare CDN.
    location /v1/public/avatars/ {
        alias /var/app/uploads/avatars/;

        # No directory listing
        autoindex off;

        # Cache headers (Cloudflare will cache for 1 year)
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";

        # Only allow GET/HEAD
        limit_except GET HEAD {
            deny all;
        }

        # Restrict by file extension (images only)
        location ~* \.(php|py|sh|exe|bat|cmd|ps1|jar|war|cgi)$ {
            deny all;
        }
    }

    # ── PRIVATE: All other /v1/ routes → FastAPI (requires auth)
    location /v1/ {
        proxy_pass http://sendbid_storage;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # No caching for API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    }

    # ── Health check (internal only — restrict in prod)
    location /health {
        proxy_pass http://sendbid_storage;
        proxy_set_header Host $host;
        # Optionally: allow only monitoring IPs
        # allow 10.0.0.0/8;
        # deny all;
    }

    # ── Block everything else
    location / {
        deny all;
        return 404;
    }

    # ── Logs
    access_log /var/log/nginx/sendbid-storage-access.log;
    error_log  /var/log/nginx/sendbid-storage-error.log warn;
}
