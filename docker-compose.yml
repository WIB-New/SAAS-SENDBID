version: "3.9"

services:
  # ── PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: sendbid_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sendbid
      POSTGRES_PASSWORD: sendbid_pass
      POSTGRES_DB: sendbid_storage
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sendbid"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Storage service
  storage:
    build: .
    container_name: sendbid_storage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATABASE_URL: postgresql+asyncpg://sendbid:sendbid_pass@db:5432/sendbid_storage
      API_KEY: ${API_KEY:-change-me-in-production}
      HMAC_SECRET: ${HMAC_SECRET:-change-me-in-production}
      UPLOAD_ROOT: /var/app/uploads
      CDN_BASE_URL: ${CDN_BASE_URL:-https://storage.sendbid.com}
    volumes:
      - uploads_data:/var/app/uploads
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  uploads_data:
