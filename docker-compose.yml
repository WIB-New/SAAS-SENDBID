services:
  # ── PostgreSQL database (internal only — no public port)
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sendbid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sendbid_storage}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sendbid}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Storage service (routed via Traefik/Dokploy — no public port)
  storage:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sendbid}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sendbid_storage}
      API_KEY: ${API_KEY:?API_KEY is required}
      HMAC_SECRET: ${HMAC_SECRET:?HMAC_SECRET is required}
      BASE_URL: ${BASE_URL:-https://storagehub.aiforge.world}
      CDN_BASE_URL: ${CDN_BASE_URL:-https://storagehub.aiforge.world}
      UPLOAD_ROOT: /var/app/uploads
    volumes:
      - uploads_data:/var/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  uploads_data:
