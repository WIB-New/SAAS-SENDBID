services:
  # ── Storage service (routed via Traefik/Dokploy — no public port)
  # PostgreSQL is provided by the managed Dokploy service "storagehub-db"
  storage:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      API_KEY: ${API_KEY:?API_KEY is required}
      HMAC_SECRET: ${HMAC_SECRET:?HMAC_SECRET is required}
      BASE_URL: ${BASE_URL:-https://storagehub.aiforge.world}
      CDN_BASE_URL: ${CDN_BASE_URL:-https://storagehub.aiforge.world}
      UPLOAD_ROOT: /var/app/uploads
    volumes:
      - uploads_data:/var/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uploads_data:
